# ============================================================
# A-Blog 默认配置（不含任何真实密钥 —— 原则2：禁止硬编码密钥）
# 密钥一律从环境变量或 secret 文件读取，见各 *_env / *_file 字段。
# 路径均相对项目根 E:\my-project\A-Blog 解析。
# ============================================================

app:
  name: "A-Blog"
  version: "1.0.0"
  host: "127.0.0.1"        # 固定本机监听（原则7：端口 8080）
  port: 8080

# ---------------- 联网搜索（Tavily，解决模型联网问题） ----------------
search:
  enabled: true                     # 生成前自动联网搜索补充素材（复盘栏目除外）
  api_key_env: "TAVILY_API_KEY"    # 搜索 API Key（环境变量）
  api_key_file: "data/tavily_key.txt"  # 或 secret 文件（chmod 600）
  max_results: 5

# ---------------- 栏目开关与调度（总纲 §4） ----------------
ai:
  enabled: true                # AI 写文总开关；false 时所有任务跳过，不消耗 Token

columns:
  stock:
    enabled: true
    category: "A股每日复盘"
    schedule: "trading-day 20:00"        # 仅交易日，固定 20:00
  tech:
    enabled: true
    category: "IT技术笔记"
    schedule: "weekly 1-3 random 09:00-21:00"
  reading:
    enabled: true
    category: "读书与国学"
    schedule: "weekly 1-3 random"
  book:
    enabled: true
    category: "读书与国学"
    schedule: "weekly 1-3 random"
  industry:
    enabled: true
    category: "行业综述"
    schedule: "weekly 1-3 random"

# ---------------- 每日配额与栏目轮换（总纲 §4） ----------------
daily:
  articles_per_day: 3          # 每日发文总量 1-10，默认 3
  token_quota_per_day: 200000  # 每日 Token 额度，默认 200k，超额当日拦截
  rotation:                    # 栏目轮换比例（合计 100）
    stock: 35
    tech: 25
    reading: 15
    book: 10
    industry: 15

# ---------------- 发布控制（总纲 §4 全部开关） ----------------
publish:
  enabled: true                # 发布总开关；false -> WP 端 status=draft
  window_start: "09:00"        # 模拟人工时段（窗口内随机分钟）
  window_end: "21:00"
  retry_times: 2               # 网络类/5xx 错误重试次数（指数退避）
  retry_backoff_base: 2.0      # 退避基数（秒）：2^1, 2^2 ...

# ---------------- WordPress（总纲 §3.2，不含密钥） ----------------
wordpress:
  base_url: "http://localhost/wordpress"   # 本机联调站点（部署时改为正式站）
  rest_path: "/index.php?rest_route=/ai-auto-blog/v1"   # plain permalink 走 rest_route（IIS 无 URL Rewrite）
  api_token_env: "ABP_API_TOKEN"        # 优先：从环境变量读取（Bearer token）
  api_token_file: "data/wp_token.txt"   # 或：单独 secret 文件（chmod 600，文件内容即 token）
  xmlrpc_username_env: "ABP_XMLRPC_USER"
  xmlrpc_password_env: "ABP_XMLRPC_PASS"
  timeout_seconds: 30
  rest_enabled: true           # REST 主通道开关
  xmlrpc_enabled: true         # XML-RPC 兜底开关（仅 REST 连续失败时启用）

# ---------------- 模型映射表（总纲 §3.4，不含密钥） ----------------
models:
  api_base: "https://api.deepseek.com/chat/completions"
  api_key_env: "ABP_MODEL_API_KEY"
  api_key_file: ""
  mapping:                     # 栏目 -> 模型名（DeepSeek 单 key 多模型）
    stock: "deepseek-v4-flash"
    tech: "deepseek-v4-flash"
    reading: "deepseek-v4-flash"
    book: "deepseek-v4-flash"
    image: ""                  # 配图模型，未配置则纯文字发布

# ---------------- 密钥补充来源（可选，KEY=VALUE 每行，chmod 600） ----------------
secrets:
  file: ""                     # 例：C:\Users\...\ablog.secrets（KEY=VALUE 每行，# 注释）

# ---------------- 模型熔断器（总纲 §6） ----------------
circuit_breaker:
  max_failures: 5              # 同一模型连续失败 N 次
  cooldown_minutes: 30         # 暂停该模型 N 分钟

# ---------------- 日志与数据（相对项目根） ----------------
logging:
  dir: "data/logs"
  level: "INFO"
  file_prefix: "app"

data:
  db_path: "data/ablog.db"
  sensitive_words_file: "data/sensitive_words.txt"
  image_cache_dir: "data/images"

# ---------------- 图片处理（总纲 §7） ----------------
image:
  width: 1280                  # 封面尺寸（青简主题 banner）
  height: 720
  webp_quality: 82

