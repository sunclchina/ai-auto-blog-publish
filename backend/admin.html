<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Blog 管理台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f3f5f7; color: #222; }
  header { background: #1d2937; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: #9fb3c8; font-size: 12px; }
  #status { margin-left: auto; font-size: 12px; color: #ffd666; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e2e6ea; border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
  .card > h2 { font-size: 15px; margin: 0; padding: 12px 16px; background: #f8fafb; border-bottom: 1px solid #eef1f4; display: flex; align-items: center; gap: 8px; }
  .card > h2 .desc { font-weight: 400; color: #8a94a0; font-size: 12px; }
  .card .body { padding: 12px 16px; }
  button { background: #fff; border: 1px solid #c9d2da; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #333; }
  button:hover { background: #f0f4f7; }
  button.primary { background: #2271b1; border-color: #2271b1; color: #fff; }
  button.primary:hover { background: #1d5f99; }
  button.danger { color: #b32d2e; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #f0f2f4; vertical-align: middle; }
  th { background: #fafbfc; color: #5a6672; font-weight: 600; white-space: nowrap; }
  tr:hover td { background: #fafcfe; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: #eef1f4; color: #55606b; }
  .badge.queued { background: #eef4ff; color: #2f5fd0; }
  .badge.generating { background: #fff7e0; color: #b07c00; }
  .badge.ready { background: #e6f7ec; color: #1d8a4e; }
  .badge.published { background: #e6f7ec; color: #1d8a4e; }
  .badge.failed { background: #fdeaea; color: #c0392b; }
  .badge.skipped { background: #f0f0f0; color: #777; }
  .badge.used { background: #f0f0f0; color: #777; }
  .ops button { margin-right: 4px; }
  .empty { color: #98a2ad; padding: 18px 4px; text-align: center; font-size: 13px; }
  .msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
  .msg.ok { color: #1d8a4e; }
  .msg.err { color: #c0392b; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .add-row select, .add-row input { padding: 5px 8px; border: 1px solid #c9d2da; border-radius: 4px; font-size: 13px; }
  .add-row input[type=text] { flex: 1; min-width: 240px; }
  .recent { color: #8a94a0; font-size: 12px; margin-top: 10px; line-height: 1.8; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .cand select { padding: 3px 6px; font-size: 12px; border: 1px solid #c9d2da; border-radius: 4px; max-width: 300px; }
  .row-actions { white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>A-Blog 管理台</h1>
  <span class="sub">伴生服务本地管理界面（仅回环可访问）</span>
  <span id="status">…</span>
</header>
<main>
  <div class="card">
    <h2>今日计划任务 <span class="desc">人工指定选题 / 删除 / 立即完成 / 清空</span></h2>
    <div class="body">
      <div class="toolbar">
        <button class="primary" onclick="loadPlan()">刷新</button>
        <button onclick="clearPlan()">清空计划（仅排队与跳过）</button>
        <button onclick="publishDue()">手动发布到期任务</button>
      </div>
      <div style="overflow-x:auto;margin-top:10px;">
        <table>
          <thead><tr><th>栏目</th><th>选题</th><th>状态</th><th>候选（可指定）</th><th>操作</th></tr></thead>
          <tbody id="plan-tbody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
      <div class="msg" id="plan-msg"></div>
    </div>
  </div>

  <div class="card">
    <h2>备用选题池 <span class="desc">排队中（每日任务按序取用）</span></h2>
    <div class="body">
      <div class="toolbar">
        <button class="primary" onclick="loadPool()">刷新</button>
        <button onclick="fillPool()">智能填充</button>
        <button class="danger" onclick="clearPool()">一键清空</button>
      </div>
      <div style="overflow-x:auto;margin-top:10px;">
        <table>
          <thead><tr><th>栏目</th><th>选题</th><th>来源</th><th>操作</th></tr></thead>
          <tbody id="pool-tbody"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
      <div class="add-row">
        <select id="pool-col">
          <option value="stock">A股复盘</option>
          <option value="tech">IT技术</option>
          <option value="reading">国学</option>
          <option value="book">书评</option>
          <option value="industry">行业综述</option>
        </select>
        <input type="text" id="pool-topic" placeholder="输入备用选题…（系统自动判断并优化标题）" />
        <button class="primary" onclick="addPool()">加入池子</button>
      </div>
      <div class="recent" id="pool-recent"></div>
      <div class="msg" id="pool-msg"></div>
    </div>
  </div>

  <div class="card">
    <h2>服务工具</h2>
    <div class="body">
      <div class="toolbar">
        <button onclick="reloadCfg()">热重载配置（config.yaml）</button>
        <span class="recent" style="margin:0;">修改 config.yaml 后无需重启服务</span>
      </div>
      <div class="msg" id="tool-msg"></div>
    </div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var COL = { stock: 'A股复盘', tech: 'IT技术', reading: '国学', book: '书评', industry: '行业综述' };
  var ST = { queued: '排队中', generating: '生成中', ready: '待发布', published: '已发布', failed: '失败', skipped: '已跳过' };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function colName(c) { return COL[c] || c || '—'; }
  function stBadge(s) { return '<span class="badge ' + esc(s) + '">' + esc(ST[s] || s || '—') + '</span>'; }
  function msg(id, text, isErr) { var m = $(id); if (m) { m.textContent = text; m.className = 'msg ' + (isErr ? 'err' : 'ok'); } }
  function api(path, opts) {
    opts = opts || {};
    return fetch(path, { method: opts.method || 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: '响应解析失败 HTTP ' + r.status }; });
    });
  }
  function confirm_(text) { return window.confirm(text); }

  /* ---------- 今日计划任务 ---------- */
  function loadPlan() {
    $('status').textContent = '加载计划…';
    api('/api/topics/today').then(function (d) {
      var tb = $('plan-tbody');
      if (!d || !d.ok) { tb.innerHTML = '<tr><td colspan="5" class="empty">加载失败：' + esc(d && (d.detail || d.error) || '未知错误') + '</td></tr>'; $('status').textContent = ''; return; }
      var tasks = d.tasks || [];
      if (!tasks.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">今日无任务（每日 08:00 自动建队列，或从备用池列入计划）</td></tr>'; }
      else {
        tb.innerHTML = tasks.map(function (t) {
          var cands = (t.topic_candidates || []).map(function (c) { return typeof c === 'string' ? c : (c.topic || ''); }).filter(Boolean);
          var sel = cands.length ? '<select data-task="' + esc(t.task_id) + '"><option value="">— 选用候选 —</option>' + cands.map(function (c, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '. ' + esc(String(c).slice(0, 60)) + '</option>'; }).join('') + '</select>' : '—';
          return '<tr><td>' + esc(colName(t.column_name)) + '</td><td>' + esc(t.topic || '（未定）') + '</td><td>' + stBadge(t.status) + '</td><td>' + sel + '</td><td class="row-actions">' +
            '<button onclick="pickCandidate(this)" data-task="' + esc(t.task_id) + '" ' + (cands.length ? '' : 'disabled') + '>指定</button> ' +
            '<button onclick="runTask(\'' + esc(t.task_id) + '\', this)" ' + (t.status === 'published' ? 'disabled' : '') + '>立即完成</button> ' +
            '<button class="danger" onclick="delTask(\'' + esc(t.task_id) + '\')" ' + (t.status === 'queued' || t.status === 'skipped' ? '' : 'disabled') + '>删除</button>' +
            '</td></tr>';
        }).join('');
      }
      $('status').textContent = '今日 ' + tasks.length + ' 个任务';
    }).catch(function (e) { $('plan-tbody').innerHTML = '<tr><td colspan="5" class="empty">网络错误</td></tr>'; $('status').textContent = ''; });
  }

  function pickCandidate(btn) {
    var taskId = btn.getAttribute('data-task');
    var sel = document.querySelector('select[data-task="' + taskId + '"]');
    if (!sel || !sel.value) { msg('plan-msg', '请先选择候选条目', true); return; }
    api('/api/topics/' + encodeURIComponent(taskId), { method: 'POST', body: { index: parseInt(sel.value, 10) } }).then(function (d) {
      msg('plan-msg', d && d.ok ? '已指定：' + (d.task && d.task.topic || '') : ('指定失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPlan();
    });
  }

  function runTask(taskId, btn) {
    if (!confirm_('立即完成该任务（生成并发布，消耗 AI 额度）？')) { return; }
    btn.disabled = true; btn.textContent = '生成中…';
    api('/api/tasks/' + encodeURIComponent(taskId) + '/run', { method: 'POST' }).then(function (d) {
      if (d && d.ok && d.async) {
        msg('plan-msg', '已开始生成（后台进行中）…');
        pollTask(taskId, btn, 0);
      } else if (d && d.ok) {
        msg('plan-msg', '完成：' + ((d.post_id && ('文章 ID ' + d.post_id)) || d.note || 'ok'), false);
        btn.disabled = false; btn.textContent = '立即完成'; loadPlan();
      } else {
        msg('plan-msg', '执行失败：' + (d && (d.detail || d.error || d.message) || '未知错误'), true);
        btn.disabled = false; btn.textContent = '立即完成';
      }
    }).catch(function () { btn.disabled = false; btn.textContent = '立即完成'; msg('plan-msg', '网络错误', true); });
  }

  function pollTask(taskId, btn, tries) {
    api('/api/tasks/' + encodeURIComponent(taskId)).then(function (d) {
      var st = d && d.task ? d.task.status : '';
      if (st === 'published') { msg('plan-msg', '✅ 已发布，文章 ID ' + (d.task.post_id || ''), false); btn.disabled = false; btn.textContent = '立即完成'; loadPlan(); }
      else if (st === 'failed' || st === 'skipped') { msg('plan-msg', (st === 'skipped' ? '跳过' : '失败') + '：' + (d.task.error || '未知错误'), true); btn.disabled = false; btn.textContent = '立即完成'; loadPlan(); }
      else if (tries < 40) { setTimeout(function () { pollTask(taskId, btn, tries + 1); }, 5000); }
      else { msg('plan-msg', '生成超时（可稍后重新点立即完成）', true); btn.disabled = false; btn.textContent = '立即完成'; loadPlan(); }
    }).catch(function () { if (tries < 40) { setTimeout(function () { pollTask(taskId, btn, tries + 1); }, 5000); } else { btn.disabled = false; btn.textContent = '立即完成'; } });
  }

  function delTask(taskId) {
    if (!confirm_('确定删除该计划任务吗？')) { return; }
    api('/api/topics/' + encodeURIComponent(taskId), { method: 'DELETE' }).then(function (d) {
      msg('plan-msg', d && d.ok ? '已删除' : ('删除失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPlan();
    });
  }

  function clearPlan() {
    if (!confirm_('清空今日计划（仅删排队与跳过，已发布保留）？')) { return; }
    api('/api/tasks/clear', { method: 'POST' }).then(function (d) {
      msg('plan-msg', d && d.ok ? '已清空' : ('清空失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPlan();
    });
  }

  function publishDue() {
    api('/api/publish-due', { method: 'POST' }).then(function (d) {
      msg('plan-msg', d && d.ok ? ('发布完成 ' + d.published + '/' + d.total) : ('失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPlan();
    });
  }

  /* ---------- 备用选题池 ---------- */
  var poolOrder = [];

  function loadPool() {
    api('/api/pool').then(function (d) {
      var tb = $('pool-tbody');
      if (!d || !d.ok) { tb.innerHTML = '<tr><td colspan="4" class="empty">加载失败</td></tr>'; return; }
      var rows = d.topics || [];
      poolOrder = rows.map(function (r) { return r.id; });
      if (!rows.length) { tb.innerHTML = '<tr><td colspan="4" class="empty">池子为空（可智能填充或手动加入）</td></tr>'; }
      else {
        tb.innerHTML = rows.map(function (r, i) {
          return '<tr><td>' + esc(colName(r.column)) + '</td><td>' + esc(r.topic) + '</td><td>' + esc({ ai: 'AI', manual: '人工', local: '素材' }[r.source] || r.source || '—') + '</td><td class="row-actions">' +
            '<button onclick="movePool(' + r.id + ',-1)" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
            '<button onclick="movePool(' + r.id + ',1)" ' + (i === rows.length - 1 ? 'disabled' : '') + '>↓</button> ' +
            '<button onclick="editPool(' + r.id + ')">编辑</button> ' +
            '<button onclick="planPool(' + r.id + ')">列入计划</button> ' +
            '<button onclick="runPool(' + r.id + ')">立即完成</button> ' +
            '<button class="danger" onclick="delPool(' + r.id + ')">删除</button>' +
            '</td></tr>';
        }).join('');
      }
      var recent = (d.recent_used || []).map(function (u) { return esc(u.topic); });
      $('pool-recent').textContent = recent.length ? '最近已用：' + recent.slice(0, 5).join('；') : '';
    }).catch(function () { $('pool-tbody').innerHTML = '<tr><td colspan="4" class="empty">网络错误</td></tr>'; });
  }

  function movePool(id, dir) {
    var idx = poolOrder.indexOf(id);
    if (idx < 0) { return; }
    var j = idx + dir;
    if (j < 0 || j >= poolOrder.length) { return; }
    var tmp = poolOrder[idx]; poolOrder[idx] = poolOrder[j]; poolOrder[j] = tmp;
    api('/api/pool/reorder', { method: 'POST', body: { ids: poolOrder } }).then(function (d) {
      if (!d || !d.ok) { msg('pool-msg', '排序失败：' + (d && (d.detail || d.error) || '未知错误'), true); }
      loadPool();
    });
  }

  function editPool(id) {
    var topic = window.prompt('编辑选题内容：');
    if (topic === null) { return; }
    api('/api/pool/' + id, { method: 'PUT', body: { topic: topic } }).then(function (d) {
      msg('pool-msg', d && d.ok ? '已保存' : ('保存失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPool();
    });
  }

  function delPool(id) {
    if (!confirm_('确定从池中删除该选题吗？')) { return; }
    api('/api/pool/' + id, { method: 'DELETE' }).then(function (d) {
      msg('pool-msg', d && d.ok ? '已删除' : ('删除失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPool();
    });
  }

  function planPool(id) {
    api('/api/pool/' + id + '/plan', { method: 'POST' }).then(function (d) {
      msg('pool-msg', d && d.ok ? '已列入今日计划' + (d.task && d.task.task_id ? '：' + d.task.task_id : '') : ('列入计划失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPool(); loadPlan();
    });
  }

  function runPool(id) {
    if (!confirm_('立即完成该备用题（列入计划并马上生成发布，消耗 AI 额度）？')) { return; }
    api('/api/pool/' + id + '/run', { method: 'POST' }).then(function (d) {
      if (d && d.ok) {
        msg('pool-msg', d.post_id ? ('✅ 已发布，文章 ID ' + d.post_id) : (d.note || '✅ 已列入计划并开始生成'), false);
        loadPool(); loadPlan();
      } else {
        msg('pool-msg', '执行失败：' + (d && (d.detail || d.error) || '未知错误'), true);
      }
    });
  }

  function addPool() {
    var topic = $('pool-topic').value.trim();
    if (!topic) { msg('pool-msg', '请输入选题内容', true); return; }
    api('/api/pool', { method: 'POST', body: { column: $('pool-col').value, topic: topic } }).then(function (d) {
      msg('pool-msg', d && d.ok ? ('✅ 已加入' + (d.optimized ? '（标题已优化）' : '')) : ('加入失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      if (d && d.ok) { $('pool-topic').value = ''; loadPool(); }
    });
  }

  function clearPool() {
    if (!confirm_('一键清空备用选题池（软删全部排队选题，保留已用历史）？')) { return; }
    api('/api/pool/clear', { method: 'POST' }).then(function (d) {
      msg('pool-msg', d && d.ok ? ('已清空 ' + d.cleared + ' 条') : ('清空失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPool();
    });
  }

  function fillPool() {
    if (!confirm_('用本地素材智能填充备用池？')) { return; }
    api('/api/pool/fill', { method: 'POST', body: {} }).then(function (d) {
      msg('pool-msg', d && d.ok ? ('已新增 ' + d.added + ' 条备用题') : ('填充失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
      loadPool();
    });
  }

  /* ---------- 服务工具 ---------- */
  function reloadCfg() {
    api('/api/reload-config', { method: 'POST' }).then(function (d) {
      msg('tool-msg', d && d.ok ? '配置已热重载' : ('失败：' + (d && (d.detail || d.error) || '未知错误')), !(d && d.ok));
    });
  }

  /* ---------- 全局（挂到 window 供 onclick 使用） ---------- */
  window.loadPlan = loadPlan; window.pickCandidate = pickCandidate; window.runTask = runTask; window.delTask = delTask;
  window.clearPlan = clearPlan; window.publishDue = publishDue;
  window.loadPool = loadPool; window.movePool = movePool; window.editPool = editPool; window.delPool = delPool;
  window.planPool = planPool; window.runPool = runPool; window.addPool = addPool; window.clearPool = clearPool; window.fillPool = fillPool;
  window.reloadCfg = reloadCfg;

  document.addEventListener('DOMContentLoaded', function () { loadPlan(); loadPool(); });
})();
</script>
</body>
</html>
